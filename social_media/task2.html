<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 2 - Responsive Pricing Cards</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background-color: #f8fafc; color: #0f172a;
  padding: 2rem 1rem; display: flex; justify-content: center;
}
.pricing { width: 100%; max-width: 1000px; text-align: center; }
.pricing h1 { margin-bottom: 1.25rem; }

/* Billing toggle pill: inline-flex */
.toggle {
  display: inline-flex; align-items: center; gap: 0.25rem;
  background: #e2e8f0; padding: 0.3rem; border-radius: 999px; margin-bottom: 2rem;
}
.toggle button {
  border: none; background: transparent; padding: 0.5rem 1.2rem;
  border-radius: 999px; font-size: 0.95rem; font-weight: 600; color: #475569; cursor: pointer;
}
.toggle button.active { background: #4f46e5; color: #fff; }

/* ---------- Mobile base: one column ---------- */
.plans { display: grid; grid-template-columns: 1fr; gap: 1rem; text-align: left; }

.card {
  position: relative; display: flex; flex-direction: column; justify-content: space-between;
  gap: 1.5rem; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 1.75rem;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.card:hover { transform: translateY(-6px); box-shadow: 0 14px 28px rgba(15, 23, 42, 0.15); }
.card h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
.price { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; }
.price .per { font-size: 0.9rem; font-weight: 400; color: #64748b; }
.card ul { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; color: #475569; }
.card li::before { content: "✓ "; color: #22c55e; font-weight: 700; }
.select-btn {
  padding: 0.85rem; border: 2px solid #4f46e5; border-radius: 10px; background: #fff;
  color: #4f46e5; font-weight: 600; font-size: 1rem; cursor: pointer; transition: transform 0.15s ease;
}
.select-btn:active { transform: scale(0.96); }

/* Featured card + glow pulse (opacity only = GPU friendly) */
.featured { border-color: #4f46e5; }
.featured::after {
  content: ""; position: absolute; inset: -4px; border-radius: 20px; z-index: -1;
  box-shadow: 0 0 22px 6px rgba(99, 102, 241, 0.65);
  animation: pulse 2s ease-in-out infinite;
}
.featured .select-btn { background: #4f46e5; color: #fff; }
.popular {
  position: absolute; top: -12px; right: 1.5rem; background: #f59e0b; color: #fff;
  font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.7rem; border-radius: 999px;
}
@keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

/* ---------- Desktop: three columns ---------- */
@media (min-width: 850px) {
  .plans { grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { .featured::after { animation: none; } }
</style>
</head>
<body>
<main class="pricing">
  <h1>Choose your plan</h1>
  <div class="toggle" role="group" aria-label="Billing period">
    <button type="button" class="active" data-period="monthly">Monthly</button>
    <button type="button" data-period="annual">Annual</button>
  </div>

  <section class="plans">
    <article class="card">
      <div>
        <h2>Starter</h2>
        <p class="price">Free</p>
        <ul><li>1 project</li><li>Community support</li><li>Basic analytics</li></ul>
      </div>
      <button class="select-btn" type="button">Select</button>
    </article>

    <article class="card featured">
      <span class="popular">POPULAR</span>
      <div>
        <h2>Pro Plan</h2>
        <p class="price"><span class="amt" data-monthly="₹799" data-annual="₹7,990">₹799</span><span class="per">/mo</span></p>
        <ul><li>Unlimited projects</li><li>Priority support</li><li>Advanced analytics</li><li>Custom domains</li><li>Export to PDF</li></ul>
      </div>
      <button class="select-btn" type="button">Select</button>
    </article>

    <article class="card">
      <div>
        <h2>Team</h2>
        <p class="price"><span class="amt" data-monthly="₹1,999" data-annual="₹19,990">₹1,999</span><span class="per">/mo</span></p>
        <ul><li>Everything in Pro</li><li>10 team seats</li></ul>
      </div>
      <button class="select-btn" type="button">Select</button>
    </article>
  </section>
</main>

<script>
// Monthly / Annual billing toggle changes the prices
const buttons = document.querySelectorAll('.toggle button');
const amounts = document.querySelectorAll('.amt');
const labels = document.querySelectorAll('.per');

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const period = btn.dataset.period;            // "monthly" or "annual"
    amounts.forEach(el => { el.textContent = el.dataset[period]; });
    labels.forEach(el => { el.textContent = period === 'monthly' ? '/mo' : '/yr'; });
  });
});
</script>
</body>
</html>
